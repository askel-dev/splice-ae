<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <span id="bridge" class="bridge" title="Command bridge status">
      <span class="dot"></span><span id="bridge-label">Bridge</span>
    </span>
    <span class="spacer"></span>
    <select id="mode" title="What Claude may do without asking">
      <option value="ae">AE tools auto</option>
      <option value="auto">Auto mode</option>
      <option value="ask">Ask every time</option>
    </select>
    <select id="model" title="Model">
      <option value="">Default model</option>
      <option value="opus">Opus</option>
      <option value="sonnet">Sonnet</option>
      <option value="haiku">Haiku</option>
    </select>
    <button id="new-chat" class="icon" title="New chat">+</button>
  </header>

  <main id="messages">
    <div id="empty" class="empty">
      <div class="logo">✳</div>
      <p>Ask Claude to do something in this project.</p>
      <p class="hint">Your active comp, playhead and selected layers are sent with each message.</p>
    </div>
  </main>

  <footer id="composer">
    <div id="attachments"></div>
    <textarea id="input" rows="1" placeholder="Message Claude…  (Enter to send, Shift+Enter for a new line)"></textarea>
    <div class="composer-row">
      <label class="toggle" title="Send the active comp, playhead and selected layers with the message">
        <input type="checkbox" id="send-context" checked> Selection context
      </label>
      <button id="attach-frame" class="ghost" title="Attach the current comp frame as an image">Attach frame</button>
      <span class="spacer"></span>
      <button id="send" class="primary">Send</button>
    </div>
  </footer>

  <script src="../shared/bridge-server.js"></script>
  <script src="markdown.js"></script>
  <script src="claude-session.js"></script>
  <script src="app.js"></script>
</body>
</html>
