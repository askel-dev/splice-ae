<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <span id="bridge" class="bridge" title="Command bridge status">
      <span class="dot"></span><span id="bridge-label">Bridge</span>
    </span>
    <span class="spacer"></span>
    <span class="select-wrap">
      <select id="mode" title="What Claude may do without asking">
        <option value="ae">AE tools auto</option>
        <option value="auto">Auto mode</option>
        <option value="ask">Ask every time</option>
      </select>
    </span>
    <span class="select-wrap" id="model-wrap">
      <select id="model" title="Model">
        <option value="">Default</option>
        <option value="opus">Opus</option>
        <option value="sonnet">Sonnet</option>
        <option value="haiku">Haiku</option>
      </select>
    </span>
    <button id="new-chat" class="icon" title="New chat">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
    </button>
  </header>

  <div id="scroller">
    <main id="messages">
      <div id="empty" class="empty">
        <div class="logo">✳</div>
        <div class="title">What should we make?</div>
        <p class="hint">Your active comp, playhead and selected layers go along with each message.</p>
        <div class="suggestions">
          <button class="suggestion">Add a subtle vignette to this comp</button>
          <button class="suggestion">Explain what the selected layers do</button>
          <button class="suggestion">Put markers on the beats of the music</button>
        </div>
      </div>
    </main>
    <button id="jump" class="jump" title="Scroll to the latest message">
      <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 3v9M4 8.5 8 12.5l4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
  </div>

  <footer id="composer">
    <div class="box">
      <div id="attachments"></div>
      <textarea id="input" rows="1" placeholder="Message Claude…"></textarea>
      <div class="composer-row">
        <label class="chip" title="Send the active comp, playhead and selected layers with the message">
          <input type="checkbox" id="send-context" checked>
          <span>
            <svg viewBox="0 0 16 16" width="12" height="12"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M2.5 6.5h11" stroke="currentColor" stroke-width="1.3"/></svg>
            <span class="text">Context</span>
          </span>
        </label>
        <button id="attach-frame" class="chip-btn" title="Attach the current comp frame as an image">
          <svg viewBox="0 0 16 16" width="12" height="12"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><circle cx="6" cy="6.8" r="1.2" fill="currentColor"/><path d="m3 12 3.5-3.5 2.5 2.5 1.5-1.5L13.5 12" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/></svg>
          <span class="text">Frame</span>
        </button>
        <span class="spacer"></span>
        <button id="send" class="send" title="Send (Enter)">
          <svg class="arrow" viewBox="0 0 16 16" width="14" height="14"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <svg class="square" viewBox="0 0 16 16" width="10" height="10"><rect x="2" y="2" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <script src="../shared/bridge-server.js"></script>
  <script src="markdown.js"></script>
  <script src="claude-session.js"></script>
  <script src="app.js"></script>
</body>
</html>
